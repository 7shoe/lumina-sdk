# Short real-data learning run before the full 20-group experiment.
case: case30
groups: [0]
seed: 42
split_seed: 42
split: [0.8, 0.1, 0.1]
limits: {train: 0, val: 0, test: 0}
model_type: HGT
loss_type: mse
selection_mse: sdk_mse
optimizer:
  AdamW: {lr: 0.001, weight_decay: 0.0001, eps: 0.00000001}
training:
  batch_size: 64
  eval_batch_size: 128
  max_samples: 100000
  max_steps: 0
  validate_every_samples: 25000
  gradient_clip: 1.0
models:
  HGT: {hidden_channels: 128, num_layers: 3, num_heads: 4, dropout: 0.1}
  RGAT: {hidden_channels: 128, num_layers: 3, num_heads: 4}
  Transformer: {hidden_dim: 128, num_layers: 3, dropout: 0.1}
