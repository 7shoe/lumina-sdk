# Pipeline verification only. No machine paths or launcher settings.
case: case30
groups: [0]
seed: 42
split_seed: 42
split: [0.8, 0.1, 0.1]
limits: {train: 32, val: 16, test: 16}
model_type: HGT
loss_type: mse
selection_mse: sdk_mse
optimizer:
  AdamW: {lr: 0.001, weight_decay: 0.0001, eps: 0.00000001}
training:
  batch_size: 8
  eval_batch_size: 8
  max_samples: 32
  max_steps: 4
  validate_every_samples: 16
  gradient_clip: 1.0
models:
  HGT: {hidden_channels: 16, num_layers: 2, num_heads: 2, dropout: 0.0}
  RGAT: {hidden_channels: 16, num_layers: 2, num_heads: 2}
  Transformer: {hidden_dim: 16, num_layers: 2, dropout: 0.0}
